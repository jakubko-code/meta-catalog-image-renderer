name: Publish Meta catalogs

on:
  workflow_dispatch:
    inputs:
      client:
        description: Optional client ID; leave empty to publish all clients
        required: false
        type: string
      force:
        description: Render every eligible product even when unchanged
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
      timezone: Europe/Bratislava

permissions:
  contents: read

concurrency:
  group: meta-catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Render and publish catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_JURISDICTION: ${{ vars.R2_JURISDICTION || 'default' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache dependencies
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache background-removal environment
        id: rembg-environment-cache
        uses: actions/cache@v5
        with:
          path: .venv-rembg
          key: ${{ runner.os }}-${{ runner.arch }}-python-3.12-rembg-${{ hashFiles('scripts/setup-u2net.js') }}

      - name: Install background-removal environment
        if: steps.rembg-environment-cache.outputs.cache-hit != 'true'
        run: npm run setup:u2net

      - name: Cache BiRefNet model
        uses: actions/cache@v5
        with:
          path: out/models/u2net
          key: ${{ runner.os }}-${{ runner.arch }}-birefnet-general-lite-v1

      - name: Run tests
        run: npm test

      - name: Publish catalogs
        env:
          TARGET_CLIENT: ${{ inputs.client || '' }}
          FORCE_RENDER: ${{ inputs.force || 'false' }}
        run: |
          args=()
          if [[ -n "$TARGET_CLIENT" ]]; then args+=("--client=$TARGET_CLIENT"); fi
          if [[ "$FORCE_RENDER" == "true" ]]; then args+=("--force"); fi
          npm run publish:all -- "${args[@]}"
